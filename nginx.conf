server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Fichiers JS/CSS générés par Vite : le nom contient un hash, cache d'un an sans risque.
    location ~* "^/assets/.+-[A-Za-z0-9_-]{8}\.(?:js|css)$" {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Images et autres fichiers de public/assets : le nom ne change pas quand le contenu change,
    # donc cache court pour que les mises à jour apparaissent sous 24 h.
    location /assets/ {
        add_header Cache-Control "public, max-age=86400";
    }

    # La page d'entrée doit toujours être revérifiée (elle pointe vers les fichiers hashés).
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
